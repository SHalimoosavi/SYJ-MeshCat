# Project-wide Gradle settings.

# JVM heap for the Gradle daemon. Kept modest for Termux/mobile build hosts;
# raise this on a desktop machine if builds are slow.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable AndroidX.
android.useAndroidX=true

# Kotlin code style for generated code.
kotlin.code.style=official

# Disable unused build features to keep Termux builds lean.
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Enable Gradle build caching and parallel execution.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

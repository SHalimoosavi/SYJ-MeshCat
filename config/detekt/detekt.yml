# Detekt configuration for SYJ-MeshChat.
# Builds upon Detekt's default ruleset (see app/build.gradle.kts:
# buildUponDefaultConfig = true). Only project-specific overrides live here.

style:
  MagicNumber:
    active: false # BLE/protocol code legitimately uses many named-but-literal byte offsets/sizes
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateMember:
    # @Preview composables are invoked by the Compose tooling via
    # reflection at preview-render time, not by any code Detekt can see —
    # without this they read as unused even though they aren't.
    ignoreAnnotated: ['Preview']

complexity:
  LongMethod:
    threshold: 80
  TooManyFunctions:
    thresholdInClasses: 20

naming:
  FunctionNaming:
    active: true
    # Composable functions are conventionally PascalCase (they're used
    # like UI components, e.g. `HomeScreen()`), which is the opposite of
    # normal Kotlin function-naming convention that this rule otherwise
    # enforces correctly everywhere else.
    ignoreAnnotated: ['Composable']

comments:
  active: false # enabled later once KDoc coverage is enforced (Milestone 12)
